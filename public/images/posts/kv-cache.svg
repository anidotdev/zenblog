<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Key-value cache across generated tokens</title>
  <desc id="desc">Rows of key and value memory blocks accumulate as each token is generated.</desc>
