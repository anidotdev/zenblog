<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Prefill and decode phases</title>
  <desc id="desc">Prefill processes the full prompt in parallel, while decode repeatedly generates one next token at a time.</desc>
  <rect width="900" height="620" fill="#f0eee8"/>
  <g font-family="IBM Plex Mono, monospace" fill="#6b6963" font-size="15" letter-spacing="1.4">
    <text x="72" y="62">TWO PHASES / DIFFERENT BOTTLENECKS</text>
    <text x="72" y="132">01 / PREFILL</text><text x="72" y="355">02 / DECODE</text>
  </g>
  <g fill="#e1ddd4" stroke="#c8c3b9" stroke-width="1.2">
    <rect x="72" y="157" width="72" height="54"/><rect x="151" y="157" width="72" height="54"/><rect x="230" y="157" width="72" height="54"/><rect x="309" y="157" width="72" height="54"/><rect x="388" y="157" width="72" height="54"/><rect x="467" y="157" width="72" height="54"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="13" fill="#34312c" text-anchor="middle">
    <text x="108" y="189">prompt</text><text x="187" y="189">tokens</text><text x="266" y="189">tokens</text><text x="345" y="189">tokens</text><text x="424" y="189">tokens</text><text x="503" y="189">tokens</text>
  </g>
  <g stroke="#8b2e2e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 222V249H503V222M296 249V272"/><path d="M288 264l8 8 8-8"/>
  </g>
  <rect x="72" y="281" width="468" height="36" fill="#8b2e2e"/>
  <text x="306" y="304" font-family="IBM Plex Mono, monospace" font-size="13" text-anchor="middle" fill="#fcfbf8" letter-spacing="1">PROCESS THE PROMPT</text>
  <g fill="#e1ddd4" stroke="#c8c3b9" stroke-width="1.2">
    <rect x="72" y="382" width="100" height="54"/><rect x="196" y="382" width="100" height="54"/><rect x="320" y="382" width="100" height="54"/><rect x="444" y="382" width="100" height="54"/><rect x="568" y="382" width="100" height="54"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="13" fill="#34312c" text-anchor="middle"><text x="122" y="414">token 1</text><text x="246" y="414">token 2</text><text x="370" y="414">token 3</text><text x="494" y="414">token 4</text><text x="618" y="414">token 5</text></g>
  <g stroke="#8b2e2e" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M172 409H192M296 409H316M420 409H440M544 409H564"/><path d="M184 402l8 7-8 7M308 402l8 7-8 7M432 402l8 7-8 7M556 402l8 7-8 7"/>
  </g>
  <path d="M668 409H725V473H122V442" fill="none" stroke="#8b2e2e" stroke-width="1.7" stroke-dasharray="5 5"/>
  <path d="M115 450l7-8 7 8" fill="none" stroke="#8b2e2e" stroke-width="1.7"/>
  <g fill="#6b6963" font-family="IBM Plex Mono, monospace" font-size="13">
    <text x="72" y="511">ONE TOKEN PER STEP</text><text x="72" y="537">PAST KEYS / VALUES ARE REUSED</text>
  </g>
  <path d="M72 550H828" stroke="#d1cdc4" stroke-width="1"/>
  <text x="72" y="590" fill="#8b2e2e" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing=".8">PARALLEL WORK</text>
  <path d="M227 585H249M242 579l7 6-7 6" fill="none" stroke="#8b2e2e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="267" y="590" fill="#8b2e2e" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing=".8">SERIAL GENERATION</text>
</svg>
